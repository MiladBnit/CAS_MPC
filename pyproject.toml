[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbsgd"
version = "0.1.0"
description = "CAS-MPC: control-aware online learning of gray-box neural state-space models for stochastic MPC"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "jax[cpu]>=0.4.30",
    "optax>=0.2.3",
    "casadi>=3.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "nbformat>=5", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]
